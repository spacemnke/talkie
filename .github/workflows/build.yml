name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    # The switchboard rules and physics don't need a Mac.
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test TalkieCore
        run: swift test

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package Talkie.app and Talkie.dmg
        run: scripts/bundle.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: Talkie
          path: |
            build/Talkie.dmg
            build/Talkie.zip
          retention-days: 14

      # Keep one always-current download: Releases → "Talkie (latest build)" → Talkie.dmg
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Talkie.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Talkie (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Not notarized yet: the first time, open System Settings → Privacy & Security and click Open Anyway."
