name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    # The switchboard rules and physics don't need a Mac.
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test TalkieCore
        run: swift test

  # Only claude/native-board signs, feeds the updater and publishes the Mac app; other branches
  # (like the iPhone work) build and test without reaching anyone's Talkie.
  mac:
    runs-on: macos-15
    # Notarization waits on Apple, usually a few minutes per file.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The Developer ID certificate (a base64 .p12 in the repository's secrets) goes into a
      # throwaway keychain for this run. Without it, the build is signed ad hoc as before.
      - name: Signing identity
        if: github.ref == 'refs/heads/claude/native-board'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "::warning::No DEVELOPER_ID_P12 secret, so this build isn't signed with Developer ID or notarized."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::The .p12 has no Developer ID Application certificate."
            exit 1
          fi
          echo "Signing as $IDENTITY"
          echo "DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package Talkie.app and Talkie.dmg
        env:
          # Every build is numbered, so Talkie's updater can tell which is newer.
          TALKIE_BUILD: ${{ github.run_number }}
          # Notarization, with the same Apple ID, team and app-specific password as DiscordDeck.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/bundle.sh release

      # The update feed Talkie checks: this build, signed with the key in the repository's secrets.
      - name: Update feed
        if: github.ref == 'refs/heads/claude/native-board'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY secret, so no update feed: Talkie can't update itself to this build."
            exit 0
          fi
          node scripts/appcast.mjs build/Talkie.zip "$GITHUB_RUN_NUMBER" "0.1.$GITHUB_RUN_NUMBER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Talkie.zip" build/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Talkie
          path: |
            build/Talkie.dmg
            build/Talkie.zip
          retention-days: 14

      # Keep one always-current download: Releases → "Talkie (latest build)" → Talkie.dmg
      - name: Publish latest build
        if: github.ref == 'refs/heads/claude/native-board'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          # The disk image for people, and the zip and feed for Talkie's updater.
          assets=(build/Talkie.dmg build/Talkie.zip)
          if [ -f build/appcast.xml ]; then assets+=(build/appcast.xml); fi
          if [ -f build/notarized ]; then
            notes="Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Signed with Developer ID and notarized by Apple."
          else
            notes="Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Not notarized yet: the first time, open System Settings → Privacy & Security and click Open Anyway."
          fi
          gh release create latest "${assets[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Talkie (latest build)" \
            --notes "$notes"

  # Talkie for iPhone: the Xcode project comes from ios/project.yml. Builds for the simulator (no
  # signing needed), then opens a few screens there with sample friends and saves screenshots.
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Talkie.xcodeproj -scheme Talkie -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Screenshots
        run: |
          set -euo pipefail
          APP=$(find build/ios/Build/Products -path '*iphonesimulator*' -name Talkie.app -maxdepth 3 | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone 16")] or [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p build/shots
          for scene in welcome board knock call add free; do
            xcrun simctl terminate "$UDID" com.spacemnke.talkie 2>/dev/null || true
            SIMCTL_CHILD_TALKIE_DEMO=$scene xcrun simctl launch "$UDID" com.spacemnke.talkie
            sleep 7
            xcrun simctl io "$UDID" screenshot "build/shots/$scene.png"
          done
          ls -l build/shots

      - uses: actions/upload-artifact@v4
        with:
          name: Talkie-iPhone-screenshots
          path: build/shots
          retention-days: 14

      # The latest screenshots, viewable without signing in: Releases → "Talkie for iPhone (preview)".
      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-preview --yes --cleanup-tag || true
          gh release create ios-preview build/shots/*.png \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Talkie for iPhone (preview)" \
            --notes "Screenshots from the iPhone simulator, built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Not an installable app yet."
