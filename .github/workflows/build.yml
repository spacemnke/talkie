name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # The switchboard rules and physics don't need a Mac.
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test TalkieCore
        run: swift test

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package Talkie.app
        run: scripts/bundle.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: Talkie-app
          path: build/Talkie.zip
          retention-days: 14
